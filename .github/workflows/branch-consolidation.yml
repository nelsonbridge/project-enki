name: Branch Consolidation

on:
  workflow_dispatch:
  pull_request:
    branches: [sandbox]
    types: [closed]
  push:
    branches: [sandbox]

permissions: {}

concurrency:
  group: branch-consolidation
  cancel-in-progress: false

jobs:
  govern:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[branch-consolidation]')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out authoritative sandbox
        uses: actions/checkout@v4
        with:
          ref: sandbox
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install branch-governance test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run branch-cleanup guardrail tests
        run: python -m pytest tests/test_branch_cleanup.py --no-cov

      - name: Select cleanup mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=audit" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [[ "$COMMIT_MESSAGE" == *"[branch-consolidation]"* ]]; then
              echo "mode=consolidate" >> "$GITHUB_OUTPUT"
            else
              echo "mode=audit" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$PR_BODY" == *"[branch-consolidation]"* ]]; then
            echo "mode=consolidate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=merged-head" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit current branch state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --report generated/audit/branch-cleanup.json

      - name: Delete only the merged head branch
        if: steps.mode.outputs.mode == 'merged-head'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$MERGED_HEAD_BRANCH" = "main" ] || [ "$MERGED_HEAD_BRANCH" = "sandbox" ]; then
            echo "Refusing to delete protected branch: $MERGED_HEAD_BRANCH" >&2
            exit 2
          fi

          ENCODED_HEAD=$(python - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["MERGED_HEAD_BRANCH"], safe=""))
          PY
          )

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/delete-branch-response.txt \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$ENCODED_HEAD")

          if [ "$HTTP_STATUS" != "204" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "422" ]; then
            cat /tmp/delete-branch-response.txt >&2
            echo "Unexpected branch-delete HTTP status: $HTTP_STATUS" >&2
            exit 2
          fi

          echo "Merged head cleanup status: $HTTP_STATUS"

      - name: Apply explicit full consolidation
        if: steps.mode.outputs.mode == 'consolidate'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t BRANCHES < <(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("generated/audit/branch-cleanup.json").read_text())
          for branch in report["requested"]:
              print(branch)
          PY
          )

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "No non-authoritative branches require consolidation."
          else
            ARGS=()
            for branch in "${BRANCHES[@]}"; do
              ARGS+=(--branch "$branch")
            done
            python scripts/cleanup_branches.py \
              --repository "$GITHUB_REPOSITORY" \
              "${ARGS[@]}" \
              --apply \
              --report generated/audit/branch-cleanup.json
          fi

      - name: Refresh audit after merged-head cleanup
        if: steps.mode.outputs.mode == 'merged-head'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --report generated/audit/branch-cleanup.json

      - name: Verify and publish governed result
        env:
          CLEANUP_MODE: ${{ steps.mode.outputs.mode }}
          MERGED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("generated/audit/branch-cleanup.json")
          report = json.loads(path.read_text())
          mode = os.environ["CLEANUP_MODE"]

          assert report["protected_unchanged"] is True, report

          if mode == "audit":
              assert report["apply"] is False, report
              assert report["deleted"] == [], report
          elif mode == "consolidate":
              assert report["apply"] is True, report
              assert report["after"] == ["main", "sandbox"], report
          else:
              merged_head = os.environ["MERGED_HEAD_BRANCH"]
              assert merged_head not in report["after"], report

          print("Verified governed branch result")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Branch governance evidence\n\n```json\n")
              summary.write(json.dumps(report, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY