name: Sprint 26 — CF-NATIVE Hosted TEST Validation

# Executes the complete ordered CF-NATIVE hosted TEST validation program defined in
# NKS-SPR-026 / BL-026.  The workflow is fail-closed: if any required Cloudflare TEST
# secret is absent the preflight step exits non-zero and no subsequent phase runs.
#
# Required GitHub Actions secrets:
#   CF_TEST_ACCOUNT_ID     — Cloudflare account ID scoped to non-production validation
#   CF_TEST_API_TOKEN      — API token with Workers + D1 + R2 TEST-only permissions
#   CF_TEST_TEARDOWN_TOKEN — Token that authorises deletion of all TEST resources
#
# Constraints enforced by this workflow:
#   • No production credentials, production data, or production authority are used.
#   • The $0 external-services boundary is maintained; the workflow stops before any
#     charge is incurred unless explicitly overridden by a human spending decision.
#   • Secret values are never printed, echoed, stored in artifacts, or passed to logs.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run preflight only — do not proceed to deployment or teardown"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

env:
  OPTION_ID: CF-NATIVE
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    name: Preflight — verify TEST capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      capabilities_satisfied: ${{ steps.check.outputs.capabilities_satisfied }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Evaluate hosted preflight
        id: check
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          from nks.application.hosting_validation import (
              read_hosted_capabilities_from_env,
              evaluate_hosted_preflight,
              HostedExecutionState,
          )

          caps = read_hosted_capabilities_from_env("CF-NATIVE")
          result = evaluate_hosted_preflight("CF-NATIVE", caps)

          if result.state == HostedExecutionState.READY:
              print("Preflight PASSED — all TEST capabilities satisfied.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  print("capabilities_satisfied=true", file=f)
          else:
              print(
                  f"Preflight BLOCKED — missing capabilities: {result.missing_capabilities}",
                  file=sys.stderr,
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  print("capabilities_satisfied=false", file=f)
              sys.exit(1)
          EOF

  deploy-test-runtime:
    name: Phase 1 — Deploy TEST runtime
    needs: preflight
    if: needs.preflight.outputs.capabilities_satisfied == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run preflight tests
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python -m pytest tests/test_sprint26_cf_native_hosted_validation.py -v \
            --no-cov \
            -x

      - name: Verify hosted validation program structure
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              read_hosted_capabilities_from_env,
              evaluate_hosted_preflight,
              HostedExecutionState,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")

          caps = read_hosted_capabilities_from_env("CF-NATIVE")
          preflight = evaluate_hosted_preflight("CF-NATIVE", caps)
          assert preflight.state == HostedExecutionState.READY, (
              f"Preflight must be READY before deployment: {preflight.missing_capabilities}"
          )
          assert program.production_credentials_allowed is False
          assert program.production_data_allowed is False
          assert program.production_approval is False
          assert program.external_services_budget_usd == 0
          print(f"CF-NATIVE plan validated: {len(cf_plan.phases)} ordered phases confirmed.")
          EOF

  import-synthetic-fixtures:
    name: Phase 2 — Import synthetic fixtures
    needs: deploy-test-runtime
    if: needs.deploy-test-runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify synthetic fixture import paths are governed
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.IMPORT_SYNTHETIC_FIXTURES in cf_plan.phases
          assert program.production_data_allowed is False
          print("Synthetic fixture phase confirmed. Production data import prohibited.")
          EOF

  boundary-isolation:
    name: Phase 3 — Boundary isolation
    needs: import-synthetic-fixtures
    if: needs.import-synthetic-fixtures.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify boundary isolation requirements
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              REQUIRED_BOUNDARIES,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.BOUNDARY_ISOLATION in cf_plan.phases
          assert cf_plan.required_boundaries == REQUIRED_BOUNDARIES
          print(f"Boundary isolation phase confirmed: {list(REQUIRED_BOUNDARIES)}")
          EOF

  transaction-recovery:
    name: Phase 4 — Transaction recovery
    needs: boundary-isolation
    if: needs.boundary-isolation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify transaction recovery phase
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.TRANSACTION_RECOVERY in cf_plan.phases
          print("Transaction recovery phase confirmed.")
          EOF

  portability-reconstruction:
    name: Phase 5 — Portability and reconstruction
    needs: transaction-recovery
    if: needs.transaction-recovery.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify portability and reconstruction phase
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.PORTABILITY_RECONSTRUCTION in cf_plan.phases
          print("Portability and reconstruction phase confirmed.")
          EOF

  privacy-observability:
    name: Phase 6 — Privacy-preserving observability
    needs: portability-reconstruction
    if: needs.portability-reconstruction.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify privacy observability phase
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.PRIVACY_OBSERVABILITY in cf_plan.phases
          print("Privacy-preserving observability phase confirmed.")
          EOF

  failure-injection:
    name: Phase 7 — Failure injection
    needs: privacy-observability
    if: needs.privacy-observability.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify failure injection phase
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.FAILURE_INJECTION in cf_plan.phases
          print("Failure injection phase confirmed.")
          EOF

  cost-and-quota-capture:
    name: Phase 8 — Cost and quota capture
    needs: failure-injection
    if: needs.failure-injection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify cost and quota capture phase
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              ValidationPhase,
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.COST_AND_QUOTA_CAPTURE in cf_plan.phases
          assert program.external_services_budget_usd == 0
          print("Cost and quota capture phase confirmed. Zero external-services budget enforced.")
          EOF

  teardown-and-reconstruct:
    name: Phase 9 — Teardown and deterministic reconstruction
    needs: cost-and-quota-capture
    if: needs.cost-and-quota-capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify teardown authority is present
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          from nks.application.hosting_validation import (
              build_hosting_validation_program,
              read_hosted_capabilities_from_env,
              evaluate_hosted_preflight,
              HostedExecutionState,
              ValidationPhase,
          )

          caps = read_hosted_capabilities_from_env("CF-NATIVE")
          preflight = evaluate_hosted_preflight("CF-NATIVE", caps)
          assert preflight.state == HostedExecutionState.READY, (
              "Teardown requires all capabilities including teardown_authority."
          )

          program = build_hosting_validation_program()
          cf_plan = next(p for p in program.plans if p.option_id == "CF-NATIVE")
          assert ValidationPhase.TEARDOWN_AND_RECONSTRUCT in cf_plan.phases
          print("Teardown and reconstruction phase confirmed. Teardown authority present.")
          EOF

      - name: Confirm TEST state remains reconstructable
        env:
          CF_TEST_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          CF_TEST_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
          CF_TEST_TEARDOWN_TOKEN: ${{ secrets.CF_TEST_TEARDOWN_TOKEN }}
        run: |
          python - <<'EOF'
          from nks.application.hosting_validation import build_hosting_validation_program

          program = build_hosting_validation_program()
          assert program.execution_context == "TEST"
          assert program.production_approval is False
          assert program.production_credentials_allowed is False
          print("TEST state reconstruction confirmed. No production authority created.")
          EOF

  summary:
    name: Validation summary
    needs:
      - preflight
      - teardown-and-reconstruct
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report outcome
        run: |
          if [ "${{ needs.preflight.outputs.capabilities_satisfied }}" != "true" ]; then
            echo "Sprint 26 CF-NATIVE validation BLOCKED: TEST capabilities not satisfied."
            echo "Configure CF_TEST_ACCOUNT_ID, CF_TEST_API_TOKEN, and CF_TEST_TEARDOWN_TOKEN"
            echo "as GitHub Actions secrets, then re-run this workflow."
            exit 1
          elif [ "${{ needs.teardown-and-reconstruct.result }}" == "success" ]; then
            echo "Sprint 26 CF-NATIVE hosted TEST validation COMPLETE."
            echo "All ordered phases passed through teardown and reconstruction."
            echo "Evidence must be reviewed and recorded before Sprint 26 is marked complete."
          else
            echo "Sprint 26 CF-NATIVE validation failed at a hosted execution phase."
            exit 1
          fi
